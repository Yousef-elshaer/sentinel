[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ioc"
version = "1.0.0"
description = "Defensive threat-intelligence and IOC triage platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "pytest-cov>=6,<7", "respx>=0.22,<1", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"


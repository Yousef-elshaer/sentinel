services:
  - type: web
    name: sentinel-yousef
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/sentinel.db
      - key: PROVIDER_TIMEOUT_SECONDS
        value: 15
